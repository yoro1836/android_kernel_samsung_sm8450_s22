name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ksu, ksu-next, non-ksu]
    outputs:
      today: ${{ steps.info.outputs.today }}
      sha: ${{ steps.info.outputs.sha }}

    steps:
    - name: Free up workflow space
      run: |
        curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
        chmod +x util_free_space.sh
        ./util_free_space.sh

    - name: Import Kernel Source
      uses: actions/checkout@v4

    - name: Install Required Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libncurses5-dev git curl clang lld libelf-dev erofs-utils unzip ccache

    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ matrix.variant }}-${{ hashFiles('**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ matrix.variant }}-

    - name: Setup KernelSU
      run: |
        git submodule update --init --recursive
        cd kernel_platform/common
        if [ "${{ matrix.variant }}" = "ksu" ]; then
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        elif [ "${{ matrix.variant }}" = "ksu-next" ]; then
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -
        fi

    - name: Get Build Info
      id: info
      run: |
        echo "today=$(date +'%y%m%d')" >> $GITHUB_OUTPUT
        echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Kernel Build
      run: |
        sudo timedatectl set-timezone "Asia/Seoul" || export TZ="Asia/Seoul"
        export KBUILD_BUILD_USER="Yoro1836"
        export KBUILD_BUILD_HOST="AkoTheCow"
        export KBUILD_BUILD_TIMESTAMP=$(date)
        export KSU_VARIANT=${{ matrix.variant }}
        
        chmod +x build.sh
        ./build.sh ak3 2>&1 | tee build.log

    - name: Prepare Files
      if: success()
      run: |
        ZIP_NAME=$(ls ZeroX-5.10*.zip | head -n 1)
        NEW_NAME="ZeroX-5.10-${{ matrix.variant }}-${{ steps.info.outputs.today }}-${{ steps.info.outputs.sha }}.zip"
        mv "$ZIP_NAME" "$NEW_NAME"
        echo "final_name=$NEW_NAME" >> $GITHUB_ENV

    - name: Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.final_name }}
        path: ${{ env.final_name }}

    - name: Notify Build Failure
      if: failure()
      run: |
        MSG=$(printf "*ZeroX Kernel Build Failed!* ❌\n\n*Variant*: \`${{ matrix.variant }}\` \n*Hash*: \`${{ steps.info.outputs.sha }}\` \n[Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})")
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
        -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
        -F "document=@build.log" \
        -F "parse_mode=Markdown" \
        -F "caption=$MSG"

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloads
          merge-multiple: true

      - name: Send Telegram Media Group
        run: |
          DATE="${{ needs.build.outputs.today }}"
          SHA="${{ needs.build.outputs.sha }}"
          
          KSU_FILE=$(ls ./downloads/*.zip | grep "\-ksu-" | grep -v "next" | head -n 1)
          NEXT_FILE=$(ls ./downloads/*.zip | grep "\-ksu-next-" | head -n 1)
          NON_KSU_FILE=$(ls ./downloads/*.zip | grep "\-non-ksu-" | head -n 1)
          
          MSG=$(printf "*ZeroX Kernel Build Success!* ⚡️\n\n*Kernel*: \`5.10\`\n*Date*: \`$DATE\`\n*Hash*: \`$SHA\`")
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "parse_mode=Markdown" \
          --data-urlencode "text=$MSG"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMediaGroup" \
          -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -F "media=[{\"type\":\"document\",\"media\":\"attach://file1\"},{\"type\":\"document\",\"media\":\"attach://file2\"},{\"type\":\"document\",\"media\":\"attach://file3\"}]" \
          -F "file1=@$KSU_FILE" \
          -F "file2=@$NEXT_FILE" \
          -F "file3=@$NON_KSU_FILE"
