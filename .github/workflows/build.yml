name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ksu, ksu-next, non-ksu]

    steps:
    - name: Free up workflow space
      run: |
        curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
        chmod +x util_free_space.sh
        ./util_free_space.sh

    - name: Import Kernel Source
      uses: actions/checkout@v4

    - name: Install Required Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libncurses5-dev git curl clang lld libelf-dev erofs-utils

    - name: Setup KernelSU
      run: |
        cd kernel_platform/common
        if [ "${{ matrix.variant }}" = "ksu" ]; then
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        elif [ "${{ matrix.variant }}" = "ksu-next" ]; then
          curl -LSs curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        fi

    - name: Setting Scripts Permission
      run: chmod +x build.sh

    - name: Kernel Build
      run: |
        export KSU_VARIANT=${{ matrix.variant }}
        ./build.sh ak3

    - name: Rename Output File
      run: |
        for file in ./ZeroX-5.10*.zip; do
          mv "$file" "${file%.zip}-${{ matrix.variant }}.zip"
        done

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: S22_Kernel_${{ matrix.variant }}
        path: ./ZeroX-5.10*-${{ matrix.variant }}.zip
