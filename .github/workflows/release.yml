name: Kernel Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [perf, batt]
        ksu: [ksu, ksu-next, non-ksu]
    
    steps:
    - name: Free up workflow space
      run: |
        curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
        chmod +x util_free_space.sh
        ./util_free_space.sh

    - name: Import Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Required Packages
      run: .github/scripts/ci.sh prepare_env

    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ matrix.ksu }}-${{ matrix.variant }}-${{ hashFiles('**/Makefile') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ matrix.ksu }}-${{ matrix.variant }}-${{ hashFiles('**/Makefile') }}-
          ${{ runner.os }}-ccache-${{ matrix.ksu }}-${{ matrix.variant }}-

    - name: Apply Patches
      run: .github/scripts/ci.sh setup_ksu
      env:
        KSU_VARIANT: ${{ matrix.ksu }}

    - name: Get Build Info
      id: info
      run: |
        echo "today=$(date +'%y%m%d')" >> $GITHUB_OUTPUT
        echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        VERSION=$(grep "^VERSION =" kernel_platform/common/Makefile | awk '{print $3}')
        PATCHLEVEL=$(grep "^PATCHLEVEL =" kernel_platform/common/Makefile | awk '{print $3}')
        SUBLEVEL=$(grep "^SUBLEVEL =" kernel_platform/common/Makefile | awk '{print $3}')
        echo "kernel_ver=$VERSION.$PATCHLEVEL.$SUBLEVEL" >> $GITHUB_OUTPUT

    - name: Kernel Build
      run: |
        export KSU_VARIANT=${{ matrix.ksu }}
        export DEFCONFIG_VARIANT=${{ matrix.variant }}
        export VERSION_SUFFIX="-${{ github.event.inputs.version }}"
        chmod +x build.sh
        ./build.sh ak3 2>&1 | tee build.log

    - name: Prepare Files
      if: success()
      run: .github/scripts/ci.sh prepare_artifact
      env:
        KSU_VARIANT: ${{ matrix.ksu }}
        DEFCONFIG_VARIANT: ${{ matrix.variant }}
        DATE: ${{ steps.info.outputs.today }}
        SHA: ${{ steps.info.outputs.sha }}
        VERSION: ${{ github.event.inputs.version }}

    - name: Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.artifact_name }}
        path: ${{ env.final_name }}

    - name: Notify Build Failure
      if: failure()
      run: .github/scripts/ci.sh notify_failure release
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        KSU_VARIANT: ${{ matrix.ksu }}
        DEFCONFIG_VARIANT: ${{ matrix.variant }}
        SHA: ${{ steps.info.outputs.sha }}
        VERSION: ${{ github.event.inputs.version }}

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: "ZeroX Kernel ${{ github.event.inputs.version }}"
        body: |
          ZeroX Kernel Release ${{ github.event.inputs.version }}
          - Date: ${{ steps.info.outputs.today }}
          - Hash: ${{ steps.info.outputs.sha }}
        files: ${{ env.final_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

    - name: Send Telegram Message
      if: success()
      run: .github/scripts/ci.sh notify_success release "${{ steps.info.outputs.kernel_ver }}" "${{ steps.info.outputs.today }}" "${{ steps.info.outputs.sha }}" "${{ github.event.inputs.version }}"
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GITHUB_REPOSITORY: ${{ github.repository }}
