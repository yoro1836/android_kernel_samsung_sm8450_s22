name: Kernel Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ksu, ksu-next, non-ksu]
    outputs:
      today: ${{ steps.info.outputs.today }}
      sha: ${{ steps.info.outputs.sha }}
      kernel_ver: ${{ steps.info.outputs.kernel_ver }}

    steps:
    - name: Free up workflow space
      run: |
        curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
        chmod +x util_free_space.sh
        ./util_free_space.sh

    - name: Import Kernel Source
      uses: actions/checkout@v4

    - name: Install Required Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libncurses5-dev git curl clang lld libelf-dev erofs-utils unzip ccache

    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ matrix.variant }}-${{ hashFiles('**/Makefile') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ matrix.variant }}-${{ hashFiles('**/Makefile') }}-
          ${{ runner.os }}-ccache-${{ matrix.variant }}-

    - name: Apply Patches
      run: |
        git submodule update --init --recursive --remote
        cd kernel_platform/common
        if [ "${{ matrix.variant }}" = "ksu" ]; then
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          patch -p1 < $GITHUB_WORKSPACE/patches/manual-hook-v1.6.patch
        elif [ "${{ matrix.variant }}" = "ksu-next" ]; then
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          patch -p1 < $GITHUB_WORKSPACE/patches/manual-hook-v1.6.patch
        fi
        wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

    - name: Get Build Info
      id: info
      run: |
        echo "today=$(date +'%y%m%d')" >> $GITHUB_OUTPUT
        echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        VERSION=$(grep "^VERSION =" kernel_platform/common/Makefile | awk '{print $3}')
        PATCHLEVEL=$(grep "^PATCHLEVEL =" kernel_platform/common/Makefile | awk '{print $3}')
        SUBLEVEL=$(grep "^SUBLEVEL =" kernel_platform/common/Makefile | awk '{print $3}')
        echo "kernel_ver=$VERSION.$PATCHLEVEL.$SUBLEVEL" >> $GITHUB_OUTPUT

    - name: Kernel Build
      run: |
        sudo timedatectl set-timezone "Asia/Seoul" || export TZ="Asia/Seoul"
        export KBUILD_BUILD_USER="Yoro1836"
        export KBUILD_BUILD_HOST="AkoTheCow"
        export KBUILD_BUILD_TIMESTAMP=$(date)
        export KSU_VARIANT=${{ matrix.variant }}
        export VERSION_SUFFIX="-${{ github.event.inputs.version }}"
        chmod +x build.sh
        ./build.sh ak3 2>&1 | tee build.log

    - name: Prepare Files
      if: success()
      run: |
        ZIP_NAME=$(ls ZeroX-5.10*.zip)
        NEW_NAME="ZeroX-${{ github.event.inputs.version }}-${{ matrix.variant }}-${{ steps.info.outputs.today }}-${{ steps.info.outputs.sha }}.zip"
        mv "$ZIP_NAME" "$NEW_NAME"
        echo "final_name=$NEW_NAME" >> $GITHUB_ENV

    - name: Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.final_name }}
        path: ${{ env.final_name }}

    - name: Notify Build Failure
      if: failure()
      run: |
        MSG=$(printf "*ZeroX Kernel Release Build Failed!* ❌\n\n*Version*: \`${{ github.event.inputs.version }}\`\n*Variant*: \`${{ matrix.variant }}\`\n*Hash*: \`${{ steps.info.outputs.sha }}\`")
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
        -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
        -F "document=@build.log" \
        -F "caption=$MSG" \
        -F "parse_mode=Markdown"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_files
          merge-multiple: true

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "ZeroX Kernel ${{ github.event.inputs.version }}"
          body: |
            ZeroX Kernel Release ${{ github.event.inputs.version }}
            - Date: ${{ needs.build.outputs.today }}
            - Hash: ${{ needs.build.outputs.sha }}
          files: ./release_files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Send Telegram Message
        run: |
          VER="${{ github.event.inputs.version }}"
          DATE="${{ needs.build.outputs.today }}"
          SHA="${{ needs.build.outputs.sha }}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/$REPO/releases/download/$VER"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "parse_mode=Markdown" \
          -d "text=$(printf "*ZeroX Kernel Release Success!* 🚀\n\n*Version*: \`$VER\`\n*Kernel*: \`${{ needs.build.outputs.kernel_ver }}\`\n*Date*: \`$DATE\`\n*Hash*: \`$SHA\`")" \
          -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"KernelSU\",\"url\":\"$BASE/ZeroX-$VER-ksu-$DATE-$SHA.zip\"}],[{\"text\":\"KernelSU Next\",\"url\":\"$BASE/ZeroX-$VER-ksu-next-$DATE-$SHA.zip\"}],[{\"text\":\"Non-KSU\",\"url\":\"$BASE/ZeroX-$VER-non-ksu-$DATE-$SHA.zip\"}]]}"
